name: Build Kestrel Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27 & CMake 3.30.5
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.30.5"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Release Keystore if missing
        working-directory: android
        run: |
          mkdir -p keystore
          if [ ! -f keystore/kestrel-release.jks ]; then
            keytool -genkeypair -noprompt \
              -keystore keystore/kestrel-release.jks \
              -alias kestrel \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass kestrel2026release \
              -keypass kestrel2026release \
              -dname "CN=Kestrel Terminal, OU=Mobile Engineering, O=Kestrel Dev, L=San Francisco, ST=CA, C=US"
          fi

      - name: Run Unit Tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --console=plain

      - name: Build Debug & Release APKs and AAB
        working-directory: android
        run: gradle assembleDebug assembleRelease bundleRelease --no-daemon --console=plain

      - name: Verify Release APK Signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt2 dump badging android/app/build/outputs/apk/release/app-release.apk | head -n 25

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-android-artifacts
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
